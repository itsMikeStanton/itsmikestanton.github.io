<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TERMINAL</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body { background: #000; overflow: hidden; width: 100vw; height: 100vh; cursor: none; }

#screen {
  position: relative;
  width: 100vw; height: 100vh;
  background: #030803;
  overflow: hidden;
}

#noise {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 15; opacity: 0.05;
}

#scanlines {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(to bottom,
    transparent 0, transparent 2px,
    rgba(0,0,0,0.14) 2px, rgba(0,0,0,0.14) 4px);
  pointer-events: none; z-index: 14;
}

#sweep {
  position: absolute; left: 0; right: 0; height: 6px;
  background: linear-gradient(transparent, rgba(51,255,51,0.05), transparent);
  pointer-events: none; z-index: 16;
  animation: sweep 9s linear infinite;
}
@keyframes sweep { 0% { top: -6px; } 100% { top: 100vh; } }

#rollbar {
  position: absolute; left: 0; right: 0; height: 120px;
  background: linear-gradient(transparent 0%, rgba(0,0,0,0.55) 35%, rgba(0,0,0,0.55) 65%, transparent 100%);
  pointer-events: none; z-index: 18;
  transform: translateY(-120px);
  animation: rollbar 14s linear infinite;
}
@keyframes rollbar {
  0%   { transform: translateY(-120px); opacity: 0; }
  6%   { opacity: 0.9; }
  87%  { opacity: 0.9; }
  97%  { transform: translateY(calc(100vh + 120px)); opacity: 0; }
  100% { transform: translateY(calc(100vh + 120px)); opacity: 0; }
}

#vignette {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.97) 100%);
  pointer-events: none; z-index: 17;
}

/* ── TERMINAL LAYOUT ─────────────────────────────── */
#terminal {
  position: absolute; inset: 0;
  padding: 24px 32px 24px 36px;
  display: flex;
  flex-direction: row;
  gap: 0;
  overflow: hidden;
  font-family: 'Courier New', Courier, monospace;
  font-size: 13px;
  line-height: 1.5;
  color: #33ff33;
  z-index: 10;
  text-shadow:
    0 0 4px rgba(51,255,51,0.65),
    1px  0 0 rgba(255,40,40,0.2),
    -1px 0 0 rgba(40,40,255,0.2);
  animation: flicker 5s infinite, ca-breathe 4.5s ease-in-out infinite;
}

#main-area {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding-right: 20px;
  border-right: 1px solid #1c421c;
}

#sidebar {
  width: 23ch;
  flex-shrink: 0;
  padding-left: 18px;
  overflow: hidden;
  white-space: pre;
  color: #2b8c2b;
  text-shadow: 0 0 3px rgba(51,255,51,0.3);
  font-size: 12.5px;
}

#output {
  flex: 1;
  overflow: hidden;
  white-space: pre-wrap;
  word-break: break-all;
}

#prompt-line {
  display: flex;
  align-items: baseline;
  flex-shrink: 0;
  min-height: 1.5em;
}

#cursor {
  display: inline-block;
  width: 7px; height: 14px;
  background: #33ff33;
  box-shadow: 0 0 8px rgba(51,255,51,0.9), 0 0 16px rgba(51,255,51,0.4);
  animation: blink 1.1s step-end infinite;
  vertical-align: bottom;
  margin-left: 1px;
  visibility: hidden;
}
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

/* ── FLICKER ───────────────────────────────────────── */
@keyframes flicker {
  0%,100% { opacity: 1; }
  2%   { opacity: 0.90; } 2.4%  { opacity: 1; }
  7%   { opacity: 0.72; } 7.4%  { opacity: 0.95; } 7.8% { opacity: 0.80; } 8.2% { opacity: 1; }
  16%  { opacity: 0.88; } 16.3% { opacity: 1; }
  22%  { opacity: 0.94; } 22.4% { opacity: 0.70; } 22.8% { opacity: 0.96; } 23.2% { opacity: 1; }
  31%  { opacity: 0.85; } 31.4% { opacity: 1; }
  39%  { opacity: 0.91; } 39.5% { opacity: 0.65; } 39.9% { opacity: 0.88; } 40.3% { opacity: 1; }
  48%  { opacity: 0.78; } 48.5% { opacity: 0.95; } 48.9% { opacity: 0.82; } 49.3% { opacity: 1; }
  55%  { opacity: 0.93; } 55.4% { opacity: 0.75; } 55.8% { opacity: 1; }
  63%  { opacity: 0.86; } 63.4% { opacity: 1; }
  70%  { opacity: 0.68; } 70.3% { opacity: 0.92; } 70.6% { opacity: 0.78; } 71%  { opacity: 1; }
  79%  { opacity: 0.89; } 79.4% { opacity: 1; }
  86%  { opacity: 0.74; } 86.3% { opacity: 0.96; } 86.7% { opacity: 0.84; } 87.1% { opacity: 1; }
  94%  { opacity: 0.91; } 94.5% { opacity: 0.67; } 94.9% { opacity: 0.93; } 95.3% { opacity: 1; }
}

@keyframes ca-breathe {
  0%,100% { text-shadow: 0 0 4px rgba(51,255,51,0.65), 1px 0 0 rgba(255,40,40,0.18), -1px 0 0 rgba(40,40,255,0.18); }
  50%     { text-shadow: 0 0 8px rgba(51,255,51,0.9),  2px 0 0 rgba(255,40,40,0.35), -2px 0 0 rgba(40,40,255,0.35); }
}

/* ── TEXT CLASSES ─────────────────────────────────── */
.dim    { color: #1c6b1c; }
.bright { color: #a0ffa0; }
.ok     { color: #00ff99; text-shadow: 0 0 5px rgba(0,255,153,0.75), 1px 0 0 rgba(255,40,40,0.15); }
.warn   { color: #ffcc00; text-shadow: 0 0 5px rgba(255,204,0,0.8),  1px 0 0 rgba(255,40,40,0.2); }
.err    { color: #ff4444; text-shadow: 0 0 5px rgba(255,68,68,0.85); }
.skull  { color: #88ff88; text-shadow: 0 0 6px rgba(51,255,51,0.9), 2px 0 0 rgba(255,40,40,0.3), -2px 0 0 rgba(40,40,255,0.3); }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="crt-warp" color-interpolation-filters="sRGB"
            x="-5%" y="-5%" width="110%" height="110%">
      <feImage id="bmap" result="dmap" preserveAspectRatio="none"/>
      <feDisplacementMap in="SourceGraphic" in2="dmap"
                         scale="170" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div id="screen">
  <canvas id="noise"></canvas>
  <div id="scanlines"></div>
  <div id="sweep"></div>
  <div id="rollbar"></div>
  <div id="vignette"></div>

  <div id="terminal">
    <div id="main-area">
      <div id="output"></div>
      <div id="prompt-line">
        <span id="prompt-span"></span>
        <span id="input-disp"></span>
        <span id="cursor"></span>
      </div>
    </div>
    <div id="sidebar"></div>
  </div>
</div>

<script>
'use strict';

// ── BARREL DISTORTION ────────────────────────────────────────────────────────
(function() {
  const W = 256, H = 256, k = 0.45, norm = 1.8;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const id = ctx.createImageData(W, H);
  const d = id.data;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const u = (x/W - 0.5)*2, v = (y/H - 0.5)*2, r2 = u*u + v*v;
      const R = Math.round((0.5 + u*k*r2/norm)*255);
      const G = Math.round((0.5 + v*k*r2/norm)*255);
      const i = (y*W+x)*4;
      d[i]   = Math.max(0,Math.min(255,R));
      d[i+1] = Math.max(0,Math.min(255,G));
      d[i+2] = 128; d[i+3] = 255;
    }
  }
  ctx.putImageData(id, 0, 0);
  document.getElementById('bmap').setAttribute('href', c.toDataURL());
  document.getElementById('screen').style.filter = 'url(#crt-warp)';
})();

// ── NOISE ────────────────────────────────────────────────────────────────────
const nc = document.getElementById('noise');
const nctx = nc.getContext('2d');
nc.width = 200; nc.height = 150;
nc.style.width = '100vw'; nc.style.height = '100vh';
const nid = nctx.createImageData(200, 150);
function drawNoise() {
  const d = nid.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = (Math.random()*255)|0;
    d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;
  }
  nctx.putImageData(nid, 0, 0);
}
drawNoise();
setInterval(drawNoise, 90);

// ── HELPERS ──────────────────────────────────────────────────────────────────
const pick  = (...a)  => a[Math.floor(Math.random()*a.length)];
const rnd   = (a,b)   => Math.floor(Math.random()*(b-a))+a;
const hex   = n       => Array.from({length:n}, () => rnd(0,16).toString(16)).join('');
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const pad   = (s,n)   => String(s).padEnd(n);
const lpad  = (s,n)   => String(s).padStart(n);

const G = {
  ip:      () => `${rnd(1,255)}.${rnd(0,255)}.${rnd(0,255)}.${rnd(1,255)}`,
  port:    () => pick(21,22,23,25,53,80,443,445,1433,3306,3389,4444,5432,6379,8080,8443,9200,27017),
  svc:     () => pick('ssh','ftp','http','https','smb','mysql','rdp','redis','mongodb','postgres','vnc','smtp'),
  exploit: () => pick('CVE-2024-6387','CVE-2024-1337','MS17-010','Log4Shell','CVE-2023-44487','ShellShock','Heartbleed','CVE-2024-3400','BlueKeep','PrintNightmare','DirtyPipe'),
  sub:     () => pick('GHOST_PROTOCOL','PHANTOM_SWEEP','KRAKEN_SCAN','MIRAGE_INJECT','SHADOW_MAP','HYDRA_SPAWN','NULL_ROUTE','VENOM_PAYLOAD','CIPHER_PULSE','WRAITH_NET','BASILISK_EYE'),
  proc:    () => pick('svchost.exe','explorer.exe','lsass.exe','winlogon.exe','systemd','nginx','apache2','mysqld','java','python3','node','chrome'),
  user:    () => pick('admin','root','administrator','guest','sysadmin','backup','deploy','jenkins','ubuntu','pi','service','oracle'),
  pass:    () => pick('password123','qwerty','letmein','admin2024','hunter2','Secure!@#','dragon','iloveyou','master','root1234','P@ssw0rd','abc123'),
  hash:    () => hex(32),
  fpath:   () => pick('/etc/shadow','/etc/passwd','/root/.ssh/id_rsa','/var/log/auth.log','/home/admin/.bash_history','C:\\Windows\\System32\\SAM','C:\\Users\\Admin\\Desktop\\passwords.txt','/var/www/html/config.php','/opt/app/.env','/etc/ssl/private/server.key'),
  fsize:   () => (Math.random()*999+1).toFixed(1)+pick('KB','KB','MB','MB','GB'),
};

// ── SIDEBAR ──────────────────────────────────────────────────────────────────
const sidebarEl = document.getElementById('sidebar');
const sL = s => '║' + s.padEnd(21).slice(0,21) + '║';
const TOP = '╔' + '═'.repeat(21) + '╗';
const SEP = '╠' + '═'.repeat(21) + '╣';
const BOT = '╚' + '═'.repeat(21) + '╝';
const BAR = (pct, w=9) => { const f=Math.round(pct/100*w); return '█'.repeat(f)+'░'.repeat(w-f); };

const sbProcs = [
  { name:'ghost-d',   st:'RUN'  },
  { name:'krakensc',  st:'RUN'  },
  { name:'netsniff',  st:'WAIT' },
  { name:'tunneld',   st:'RUN'  },
  { name:'keyd',      st:'IDLE' },
  { name:'phantomd',  st:'RUN'  },
];
const TRANS = {
  RUN:  { RUN:0.92, WAIT:0.06, IDLE:0.02 },
  WAIT: { RUN:0.3,  WAIT:0.6,  IDLE:0.1  },
  IDLE: { RUN:0.15, WAIT:0.15, IDLE:0.7  },
};
function nextState(s) {
  let r = Math.random(), c = 0;
  for (const [k,v] of Object.entries(TRANS[s])) { c+=v; if (r<c) return k; }
  return s;
}

let sb = { cpu:65, ram:55, net:72, up:2.1, dn:0.8, nodes:4821, owned:247, exfil:47.3, conns:183 };

function updateSidebar() {
  sb.cpu   = clamp(sb.cpu   + rnd(-9,9),  15, 99);
  sb.ram   = clamp(sb.ram   + rnd(-5,5),  25, 90);
  sb.net   = clamp(sb.net   + rnd(-10,10),20, 99);
  sb.up    = Math.max(0.1, Math.min(9.9, sb.up  + (Math.random()-0.5)*0.6));
  sb.dn    = Math.max(0.1, Math.min(4.9, sb.dn  + (Math.random()-0.5)*0.3));
  sb.conns = clamp(sb.conns + rnd(-8,8),  80, 350);
  if (Math.random()<0.35) sb.nodes += rnd(1,25);
  if (Math.random()<0.12) sb.owned += rnd(1,4);
  if (Math.random()<0.5)  sb.exfil += Math.random()*0.8;
  sbProcs.forEach(p => { p.st = nextState(p.st); });

  const stColor = s => s==='RUN' ? '▶' : s==='WAIT' ? '◌' : '·';

  const lines = [
    TOP,
    sL('  ▓ SYS MONITOR v9.1'),
    SEP,
    sL(` CPU ${BAR(sb.cpu)}  ${lpad(sb.cpu,3)}%`),
    sL(` RAM ${BAR(sb.ram)}  ${lpad(sb.ram,3)}%`),
    sL(` NET ${BAR(sb.net)}  ${lpad(sb.net,3)}%`),
    SEP,
    sL(` ↑ ${lpad(sb.up.toFixed(1),4)} GB/s`),
    sL(` ↓ ${lpad(sb.dn.toFixed(1),4)} GB/s`),
    sL(` CONNS: ${lpad(sb.conns,5)}`),
    SEP,
    sL('  PROCESSES'),
    ...sbProcs.map(p => sL(` ${stColor(p.st)} ${pad(p.name,9)}[${pad(p.st,4)}]`)),
    SEP,
    sL(` NODES  ${lpad(sb.nodes.toLocaleString(),7)}`),
    sL(` OWNED  ${lpad(sb.owned,7)}`),
    sL(` EXFIL  ${lpad(sb.exfil.toFixed(1),5)}GB`),
    BOT,
  ];
  sidebarEl.textContent = lines.join('\n');
}
updateSidebar();
setInterval(updateSidebar, 1200);

// ── SKULL ART ────────────────────────────────────────────────────────────────
const SKULL = [
  '        ░░░░░░░░░░░░░        ',
  '      ░░             ░░      ',
  '     ░   ████   ████   ░     ',
  '     ░   ████   ████   ░     ',
  '     ░               ░     ',
  '      ░░  █████████  ░░      ',
  '        ░░░░░░░░░░░░░        ',
  '          ██     ██          ',
  '         ████   ████         ',
  '        █ █ █████ █ █        ',
  '        █████████████        ',
];

// ── TERMINAL STATE ───────────────────────────────────────────────────────────
const outputEl    = document.getElementById('output');
const promptSpan  = document.getElementById('prompt-span');
const inputDispEl = document.getElementById('input-disp');
const cursorEl    = document.getElementById('cursor');
const termEl      = document.getElementById('terminal');
const PROMPT      = 'root@DARKNET-7:~# ';

let state       = 'BOOT';
let hackQueue   = [];
let hackTimer   = null;
let inputBuffer = '';

function addLine(text, cls) {
  const div = document.createElement('div');
  if (cls) div.className = cls;
  div.textContent = text;
  outputEl.appendChild(div);
  while (outputEl.children.length > 600) outputEl.removeChild(outputEl.firstChild);
  outputEl.scrollTop = outputEl.scrollHeight;
  return div;
}

function setIdle() {
  state = 'IDLE';
  promptSpan.textContent = PROMPT;
  inputDispEl.textContent = inputBuffer;
  cursorEl.style.visibility = 'visible';
}

// ── ANIMATED PROGRESS BAR ────────────────────────────────────────────────────
// Queue item with type:'bar' animates a single line in-place
function animateBar(cfg, done) {
  const W     = 24;
  const steps = cfg.steps || 20;
  const delay = cfg.delay || 75;
  const div   = addLine('', '');
  let step = 0;

  function tick() {
    const f   = Math.round(step/steps*W);
    const pct = Math.round(step/steps*100);
    const bar = '█'.repeat(f) + '░'.repeat(W-f);
    if (step < steps) {
      div.textContent = `${cfg.label} [${bar}] ${lpad(pct,3)}%`;
      div.className   = '';
      step++;
      setTimeout(tick, delay + rnd(0, delay>>1));
    } else {
      div.textContent = `${cfg.label} [${bar}] ${cfg.done||'DONE'}`;
      div.className   = cfg.doneCls || '';
      outputEl.scrollTop = outputEl.scrollHeight;
      setTimeout(done, rnd(60,180));
    }
  }
  tick();
}

// ── QUEUE PROCESSOR ──────────────────────────────────────────────────────────
function processQueue() {
  if (hackQueue.length === 0) { setIdle(); return; }

  const item = hackQueue.shift();

  if (item === null || item === undefined) {
    // blank line spacer
    addLine('', '');
    hackTimer = setTimeout(processQueue, rnd(80,200));
    return;
  }

  if (item.type === 'bar') {
    animateBar(item, processQueue);
    return;
  }

  // [cls, text] tuple
  const [cls, text] = Array.isArray(item) ? item : ['', item];
  addLine(text, cls);
  hackTimer = setTimeout(processQueue, rnd(28,95));
}

// ── HACKING ROUTINES ─────────────────────────────────────────────────────────
const ROUTINES = [

  // 0 — Port scan
  () => { const t=G.ip(), n=rnd(4,9);
    const r = [['','`nmap -sS -T4 -p- --open '+t+'`'],['dim','SYN scan  rate:1000pps  os:Linux 5.x']];
    for(let i=0;i<n;i++) r.push(['ok',`[+] ${pad(G.port()+'/tcp',10)} OPEN   ${G.svc()}`]);
    r.push(['dim',`Scan done: ${n} ports in ${rnd(1,12)}.${rnd(0,9)}s`]);
    return r;
  },

  // 1 — Brute force
  () => { const t=G.ip(), u=G.user(), p=G.pass();
    return [
      ['',`hydra -l ${u} -P rockyou.txt ssh://${t}`],
      ['dim','[*] 14,344,391 passwords  threads:16'],
      ['dim',`[-] ${u}:password123 ... FAIL`],
      ['dim',`[-] ${u}:qwerty ....... FAIL`],
      ['dim',`[-] ${u}:${pick('letmein','dragon','admin')} ....... FAIL`],
      {type:'bar', label:'[*] attacking:  ', steps:16, delay:65, done:'FOUND', doneCls:'ok'},
      ['ok', `[+] VALID CREDS → ${u} : ${p}`],
      ['ok', `[+] token: ${hex(32)}`],
    ];
  },

  // 2 — Hash crack
  () => { const h=G.hash(), p=G.pass();
    return [
      ['',`hashcat -m 0 ${h} rockyou.txt`],
      ['dim',`[*] MD5  speed: ${rnd(200,999)}.${rnd(1,9)} MH/s`],
      {type:'bar', label:'[*] cracking:   ', steps:18, delay:70, done:'CRACKED', doneCls:'ok'},
      ['ok', `[+] ${h} → "${p}"`],
      ['ok', '[+] written → /loot/hashes.txt'],
    ];
  },

  // 3 — Exploit
  () => { const t=G.ip(), e=G.exploit();
    return [
      ['warn',`[!] ${e}`],
      ['',   `[*] target: ${t}:${G.port()}`],
      ['',   '[*] payload: linux/x64/meterpreter/reverse_tcp'],
      ['dim','[*] encoding: shikata_ga_nai ×3'],
      {type:'bar', label:'[*] exploiting: ', steps:14, delay:90, done:'SHELL', doneCls:'warn'},
      ['ok', `[+] Meterpreter session opened`],
      ['ok', `[+]   ${G.ip()}:4444 ← ${t}:${rnd(1024,65534)}`],
      ['ok', '[+] uid=0(root) gid=0(root) — OWNED'],
    ];
  },

  // 4 — Subroutine
  () => { const s=G.sub();
    return [
      ['',     `[*] exec ${s}`],
      ['dim',  `[*] deps: OK   heap: ${rnd(128,512)}MB`],
      {type:'bar', label:'[*] stage 1/4:  ', steps:10, delay:80,  done:'RECON DONE'},
      {type:'bar', label:'[*] stage 2/4:  ', steps:10, delay:95,  done:'IN'},
      {type:'bar', label:'[*] stage 3/4:  ', steps:10, delay:110, done:'ROOT'},
      {type:'bar', label:'[*] stage 4/4:  ', steps:8,  delay:120, done:'PERSISTED', doneCls:'ok'},
      ['ok',   `[+] ${s} complete`],
      ['bright',`>> ${rnd(12,999)} new targets queued`],
    ];
  },

  // 5 — Exfil
  () => { const t=G.ip();
    return [
      ['',  `[*] shell: ${t}`],
      ['ok',`[+] ${G.fpath()}  (${G.fsize()})`],
      ['ok',`[+] ${G.fpath()}  (${G.fsize()})`],
      ['ok',`[+] ${G.fpath()}  (${G.fsize()})`],
      ['',  '[*] AES-256-GCM encrypt + compress...'],
      {type:'bar', label:'[*] exfil:      ', steps:20, delay:55, done:'SENT', doneCls:'ok'},
      ['ok', `[+] ${G.fsize()} transferred in ${(Math.random()*4+0.4).toFixed(2)}s`],
      ['dim','[*] logs wiped'],
    ];
  },

  // 6 — MITM
  () => { const a=G.ip(), b=G.ip();
    return [
      ['',    `arpspoof -i eth0 -t ${b} ${a}`],
      ['warn','[!] ARP poisoned — MITM active'],
      {type:'bar', label:'[*] intercepting:', steps:12, delay:80, done:'CAPTURING'},
      ['ok',  `[+] HTTP:   ${G.user()} / ${G.pass()} @ ${b}`],
      ['ok',  `[+] cookie: ${hex(32)}`],
      ['ok',  `[+] JWT:    eyJ${hex(20)}...`],
      ['dim', '[*] forwarding — target unaware'],
    ];
  },

  // 7 — Botnet
  () => { const n=rnd(1000,12000), t=G.ip();
    return [
      ['',    `[*] C2: ${G.ip()}:${G.port()}`],
      ['ok',  `[+] botnet ONLINE: ${n.toLocaleString()} nodes`],
      ['dim', `[*] RU ${rnd(20,38)}%  CN ${rnd(15,28)}%  US ${rnd(8,18)}%  OTHER`],
      {type:'bar', label:'[*] deploying:  ', steps:20, delay:50, done:`${n.toLocaleString()} UPDATED`, doneCls:'ok'},
      ['warn',`[!] FLOOD → ${t}  est. ${rnd(80,999)} Gbps`],
      ['ok',  '[+] attack launched'],
    ];

function getRoutine() {
  return ROUTINES[rnd(0, ROUTINES.length)]();
}

function getRoutineFor(cmd) {
  if (!cmd) return getRoutine();
  const s = cmd.toLowerCase();
  if (/nmap|scan|port/.test(s))          return ROUTINES[0]();
  if (/hydra|brute|crack|ssh/.test(s))   return ROUTINES[1]();
  if (/hash|hashcat|john/.test(s))       return ROUTINES[2]();
  if (/exploit|msf|msfconsole/.test(s))  return ROUTINES[3]();
  if (/run|exec|sub|phantom/.test(s))    return ROUTINES[4]();
  if (/exfil|wget|scp|rsync/.test(s))    return ROUTINES[5]();
  if (/arp|mitm|poison/.test(s))         return ROUTINES[6]();
  if (/bot|c2|ddos|flood/.test(s))       return ROUTINES[7]();
  if (/key|log|harvest/.test(s))         return ROUTINES[8]();
  if (/rsa|aes|crypt|sign|key/.test(s))  return ROUTINES[9]();
  if (/sql|inject|db/.test(s))           return ROUTINES[10]();
  if (/priv|sudo|root|esc/.test(s))      return ROUTINES[11]();
  if (/tcpdump|pcap|sniff/.test(s))      return ROUTINES[12]();
  if (/pivot|lateral|move/.test(s))      return ROUTINES[13]();
  if (/rootkit|hide|stealth/.test(s))    return ROUTINES[14]();
  if (/zero|0day|broker/.test(s))        return ROUTINES[15]();
  if (/decrypt|aes|cipher/.test(s))      return ROUTINES[16]();
  if (/skull|override|phantom root/.test(s)) return ROUTINES[17]();
  if (/wifi|wireless|wpa|wlan/.test(s))  return ROUTINES[19]();
  return getRoutine();
}

// ── EXECUTE COMMAND ──────────────────────────────────────────────────────────
function execute(cmd) {
  if (cmd.trim()) addLine(PROMPT + cmd, 'dim');

  const routine = getRoutineFor(cmd);

  if (state === 'HACKING') {
    routine.forEach(i => hackQueue.push(i));
    hackQueue.push(null);
    return;
  }

  state = 'HACKING';
  promptSpan.textContent = '';
  inputDispEl.textContent = '';
  cursorEl.style.visibility = 'hidden';

  routine.forEach(i => hackQueue.push(i));
  hackQueue.push(null);
  processQueue();
}

// ── KEYBOARD ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (state === 'BOOT') return;

  const skip = ['Shift','Control','Alt','Meta','CapsLock',
                'F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12',
                'ArrowUp','ArrowDown','ArrowLeft','ArrowRight',
                'Home','End','PageUp','PageDown','Insert','Delete','Tab'];
  if (skip.includes(e.key)) return;
  e.preventDefault();

  if (e.key === 'Escape') {
    inputBuffer = '';
    inputDispEl.textContent = '';
    return;
  }

  if (e.key === 'Backspace') {
    inputBuffer = inputBuffer.slice(0,-1);
    inputDispEl.textContent = inputBuffer;
    return;
  }

  if (e.key === 'Enter') {
    const cmd = inputBuffer;
    inputBuffer = '';
    inputDispEl.textContent = '';
    execute(cmd);
    return;
  }

  if (e.key.length === 1) {
    inputBuffer += e.key;
    inputDispEl.textContent = inputBuffer;
  }
});
