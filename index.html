<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TERMINAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="crt-warp" color-interpolation-filters="sRGB"
            x="-5%" y="-5%" width="110%" height="110%">
      <feImage id="bmap" result="dmap" preserveAspectRatio="none"/>
      <feDisplacementMap in="SourceGraphic" in2="dmap"
                         scale="170" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div id="screen">
  <canvas id="noise"></canvas>
  <div id="scanlines"></div>
  <div id="sweep"></div>
  <div id="rollbar"></div>
  <div id="vignette"></div>
  <div id="reflection"></div>

  <div id="ghost-cursor"></div>
  <div id="sound-toggle">[SOUND]</div>
  <div id="terminal">
    <div id="main-area">
      <div id="content-panel"></div>
      <div id="output"></div>
      <div id="prompt-line">
        <span id="prompt-span"></span>
        <span id="input-disp"></span>
        <span id="cursor"></span>
      </div>
    </div>
    <div id="sidebar">
      <div id="sidebar-content"></div>
      <div id="sidebar-tab">[TAB]</div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/terminal.js"></script>
<script src="js/effects.js"></script>
<script src="js/routines.js"></script>
<script src="js/scrollbar.js"></script>
<script src="js/panel.js"></script>
<script src="js/menu.js"></script>
<script src="js/main.js"></script>
<!-- js/sections/<name>.js are loaded on demand by panel.js -->

</body>
</html>
